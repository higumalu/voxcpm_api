# Hermes Agent TTS provider 設定範例
#
# 複製到 ~/.hermes/config.yaml 的 tts 區塊，或合併進既有設定。
#
# 前置步驟：
# 1. 啟動 VoxCPM API 服務（本機或 Docker）
# 2. 以 POST /v1/voices 上傳參考音檔，取得 voice_id
# 3. 設定 VOXCPM_DEFAULT_VOICE_ID 環境變數

tts:
  provider: voxcpm
  providers:
    voxcpm:
      type: command
      command: "voxcpm-hermes-bridge --text-file {input_path} --out {output_path}"
      output_format: wav
      timeout: 180
      voice_compatible: true
      max_text_length: 5000

# 若 Hermes 跑在 Docker 內、API 在宿主機：
