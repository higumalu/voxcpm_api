services:
  voxcpm-api:
    build: .
    image: voxcpm-api:latest
    container_name: voxcpm-api
    ports:
      - "8000:8000"
    volumes:
      - ./voices:/app/voices
      - C:/Users/HIGUMALU/.cache/huggingface:/root/.cache/huggingface:rw
    environment:
      VOXCPM_VOICES_DIR: /app/voices
      VOXCPM_MODEL_NAME: ${VOXCPM_MODEL_NAME:-openbmb/VoxCPM2}
      VOXCPM_LOAD_DENOISER: ${VOXCPM_LOAD_DENOISER:-false}
      VOXCPM_OPTIMIZE: "false"
      VOXCPM_DEVICE: ${VOXCPM_DEVICE:-auto}
      VOXCPM_WSL2_DOCKER: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      # WSL2: expandable_segments needs CUDA VMM, which is unreliable in Docker/WSL2
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_VISIBLE_DEVICES: "0"
    gpus: all
    ipc: host
    shm_size: "32gb"
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s